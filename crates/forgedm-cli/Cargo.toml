[package]
name = "forgedm-cli"
description = "ForgeDM command-line client (binary forgedm)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "forgedm"
path = "src/main.rs"

[dependencies]
forgedm-ipc.workspace = true
forgedm-protocol.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
forgedm-fixture.workspace = true
tempfile.workspace = true

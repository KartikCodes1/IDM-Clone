[package]
name = "forgedm-agent"
description = "ForgeDM background agent (library and forgedm-agent binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "forgedm_agent"
path = "src/lib.rs"

[[bin]]
name = "forgedm-agent"
path = "src/main.rs"

[features]
# Never enabled in release builds. Used by S1.14 crash-matrix tests (PLAN S1.14,
# check.ps1 no-fault-injection-in-release / Inv-24).
fault-injection = []

[dependencies]
forgedm-core.workspace = true
forgedm-storage.workspace = true
forgedm-ipc.workspace = true
forgedm-protocol.workspace = true
forgedm-platform.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
tokio-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
hex.workspace = true
uuid.workspace = true

[dev-dependencies]
forgedm-fixture.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

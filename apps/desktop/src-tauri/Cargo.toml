[package]
name = "forgedm-desktop"
description = "ForgeDM desktop shell (Tauri): talks to the agent only through forgedm-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "forgedm_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "forgedm-desktop"
path = "src/main.rs"

[features]
# Set by `tauri build`: serve the embedded frontend instead of the dev server URL.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
forgedm-ipc.workspace = true
forgedm-protocol.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
